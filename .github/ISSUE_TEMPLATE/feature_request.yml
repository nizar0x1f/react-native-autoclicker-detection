name: Feature request
description: Suggest an idea or improvement for this library.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        # Feature request

        Describe the problem first, then the change you would like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the library does not support?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like the library to behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: React Native version, platform, or anything else relevant.
